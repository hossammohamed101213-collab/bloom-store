<!doctype html><html><meta charset="utf-8"><title>Native NEXBOT verification</title><style>body{margin:0;background:#080808}canvas{width:100vw;height:100vh;display:block}pre{position:fixed;left:15px;bottom:0;color:#8c9baf;font:10px monospace;max-height:20vh;overflow:auto;background:#08080899}</style><canvas></canvas><pre id="status">Loading local 3D scene…</pre><script type="module">const t=performance.now();try{const {Application}=await import('./vendor/spline-runtime.js');const app=new Application(document.querySelector('canvas'));await app.load('./vendor/nexbot.splinecode');app.setBackgroundColor('#080808');app.setZoom(.8);document.querySelector('#status').textContent='LOCAL SCENE READY: '+((performance.now()-t)/1000).toFixed(2)+'s\n'+app.getAllObjects().map(o=>o.name).join(' | ');}catch(e){document.querySelector('#status').textContent=String(e);}</script></html>
